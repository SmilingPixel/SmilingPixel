name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * 0'  # At midnight UTC on Sunday
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # See [action change log](https://github.com/czl9707/gh-space-shooter/releases/tag/v2)

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # output-path: 'game.gif'
          # write-dataurl-to: 'README.md'   # for dataurl generation.
          strategy: 'random'
